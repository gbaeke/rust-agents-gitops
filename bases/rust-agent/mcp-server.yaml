# Stateless (no MCP sessions), so it runs as several replicas from the start.
# Reached only through the central AI gateway, on /<app>/mcp (see
# platform/ai-gateway/apps/<app>/mcp.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels: { app: mcp-server }
  template:
    metadata:
      labels: { app: mcp-server }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mcp-server
          image: localhost:5001/rust-agents/mcp-server # tag set by scripts/release.sh
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_ADDR
              value: 0.0.0.0:8081
            # Host names callers may use (DNS-rebinding protection). The full
            # names contain the namespace, so each overlay sets its own list, as
            # env/1: keep this entry second.
            - name: MCP_ALLOWED_HOSTS
              value: mcp-server,mcp-server:8081
          ports:
            - { name: http, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector: { app: mcp-server }
  ports:
    - { name: http, port: 8081, targetPort: http }
