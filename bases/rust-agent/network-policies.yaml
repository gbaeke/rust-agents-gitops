# Model and tool traffic must go through the central AI gateway: the agent may
# only talk to the gateway's proxy pods, its own Postgres and DNS, and the MCP
# server only takes requests from those proxy pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels: { app: agent }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ai-gateway }
          podSelector:
            matchLabels: { gateway.networking.k8s.io/gateway-name: ai-gateway }
      ports: [{ port: 8080 }]
    - to:
        - podSelector:
            matchLabels: { app: postgres }
      ports: [{ port: 5432 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-server-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels: { app: mcp-server }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ai-gateway }
          podSelector:
            matchLabels: { gateway.networking.k8s.io/gateway-name: ai-gateway }
      ports: [{ port: 8081 }]
