# The first agent: bases/rust-agent as is, in namespace rust-agents, on
# NodePort 30000 (http://<host>:31000).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rust-agents
resources:
  - ../../bases/rust-agent
  - sealed-postgres.yaml
  - sealed-gateway-key.yaml
configMapGenerator:
  - name: agent-config
    behavior: merge
    literals:
      - MCP_URL=http://ai-gateway.ai-gateway.svc.cluster.local:8080/rust-agents/mcp
patches:
  # Written by scripts, so their wave is patched in: secrets come first.
  - target: {kind: SealedSecret}
    patch: |-
      - { op: add, path: /metadata/annotations, value: { argocd.argoproj.io/sync-wave: "-1" } }
  # The MCP server's allowed host names (DNS-rebinding protection), with this
  # namespace in them. env/1 is MCP_ALLOWED_HOSTS in bases/rust-agent/mcp-server.yaml.
  - target: {kind: Deployment, name: mcp-server}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: mcp-server,mcp-server:8081,mcp-server.rust-agents,mcp-server.rust-agents:8081,mcp-server.rust-agents.svc.cluster.local,mcp-server.rust-agents.svc.cluster.local:8081
