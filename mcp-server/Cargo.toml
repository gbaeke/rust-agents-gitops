[package]
name = "mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
evalexpr = "13.1.0"
html2text = "0.17.4"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rmcp = { version = "3.8", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
