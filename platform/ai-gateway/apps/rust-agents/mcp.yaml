# rust-agents' MCP server, on the central gateway at /rust-agents/mcp (D10).
# The server keeps no sessions, so neither does the gateway: each request goes
# upstream on its own and any replica of either can serve it.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-rust-agents
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  mcp:
    sessionRouting: Stateless
    targets:
      - name: tools
        static:
          host: mcp-server.rust-agents.svc.cluster.local
          port: 8081
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-rust-agents
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: ai-gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: /rust-agents/mcp }
      backendRefs:
        - { group: agentgateway.dev, kind: AgentgatewayBackend, name: mcp-rust-agents }
---
# Only rust-agents' own key may use its tools; another app's valid key is
# refused here.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-rust-agents
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: mcp-rust-agents }
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - apiKey.app == "rust-agents"
