# Request limits per app (D11): each app counts in its own bucket (key
# apiKey.app), so one app over its limit gets 429 without slowing the others.
# Every request counts, model calls and tool calls alike. An app without a
# matching condition has no limit.
#
# These are local limits: each gateway replica counts on its own, so with 2
# replicas an app can get up to about twice its limit. A strict cluster-wide
# limit needs `global` and a rate limit service.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: limits
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: ai-gateway }
  traffic:
    rateLimit:
      conditional:
        - condition: apiKey.app == "research-agent"
          policy:
            local:
              - { key: apiKey.app, requests: 30, unit: Minutes }
