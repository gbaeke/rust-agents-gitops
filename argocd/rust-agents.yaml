# The rust-agents app, after the platform (wave 1). Phase 5 replaces this
# with an ApplicationSet over apps/*, keeping the same name.
#
# No resources-finalizer for now, so that the switch to the ApplicationSet
# deletes only this Application and leaves what it deployed running for the
# new one to take over. The ApplicationSet's template brings it back.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rust-agents
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: apps
  source:
    repoURL: https://github.com/gbaeke/rust-agents-gitops.git
    targetRevision: main
    path: apps/rust-agents
  destination:
    server: https://kubernetes.default.svc
    namespace: rust-agents
  syncPolicy:
    automated: { prune: true, selfHeal: true }
