# The platform, as one Application per piece, in sync waves: the root waits
# for each wave to be Healthy before the next (see the Application health
# check in bootstrap/argocd-values.yaml).
#
# No resources-finalizer on these: removing one from git orphans what it
# installed instead of deleting it. Deleting CRDs would delete every object
# of those kinds in the cluster.
#
# Wave -3: Sealed Secrets, in kube-system under the name kubeseal expects by
# default. bootstrap.sh restores the old sealing key before this starts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0 # controller 0.41.2
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        # No new key every 30 days: one key, backed up once by
        # scripts/sealing-key.sh, keeps every SealedSecret in git readable
        # after the cluster is rebuilt.
        keyrenewperiod: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
# Wave -3: the Gateway API CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  source:
    repoURL: https://github.com/gbaeke/rust-agents-gitops.git
    targetRevision: main
    path: platform/gateway-api
  destination:
    server: https://kubernetes.default.svc
    # Only cluster-scoped CRDs, so the namespace is unused, but the platform
    # project only allows destinations with one of its namespaces.
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
---
# Wave -2: agentgateway's own CRDs (AgentgatewayModel, ...Backend, ...Policy,
# ...Parameters).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: oci://cr.agentgateway.dev/charts/agentgateway-crds
    path: .
    targetRevision: v1.7.0
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Wave -1: the agentgateway controller. It creates the GatewayClass
# agentgateway itself at runtime (the chart doesn't), so Argo doesn't track
# it, and it runs a proxy for every Gateway of that class.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: oci://cr.agentgateway.dev/charts/agentgateway
    path: .
    targetRevision: v1.7.0
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
